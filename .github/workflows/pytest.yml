name: Run Pytest on Pull Request

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Line coverage through sys.monitoring instead of the default sys.settrace
      # tracer: the report stays the same, the tracing overhead mostly goes away.
      # Branch coverage (--cov-branch) needs Python 3.14 with this core.
      COVERAGE_CORE: sysmon

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: |
          uv sync --extra dev

      - name: Run tests
        # The Sphinx build ('docs') and the Docker checks ('docker') run in their
        # own jobs below, in parallel. --durations lists the slowest tests.
        run: |
          uv run pytest --finalize --check-config-side-effect -m "not docs and not docker" -vs --durations=25 --cov src --cov-report term-missing

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: optimize-results
          path: tests/testdata/**/new_optimize_result*
          if-no-files-found: ignore

  docs-test:
    # Full Sphinx HTML build (tests marked 'docs'), split off the test job.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: |
          uv sync --extra dev

      - name: Run Sphinx build test
        run: |
          uv run pytest --finalize --check-config-side-effect -m docs -vs

  docker-test:
    # Docker image and Home Assistant add-on builder checks (tests marked 'docker').
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: |
          uv sync --extra dev

      - name: Run Docker tests
        run: |
          uv run pytest --finalize --check-config-side-effect -m docker -vs

  browser-test:
    # EOSdash in headless Chromium (tests marked 'browser', enabled by --browser-test).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: |
          uv sync --extra dev

      - name: Install Chromium with its system libraries
        run: |
          uv run playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          uv run pytest --browser-test -m browser -vs
